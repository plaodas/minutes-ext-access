services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: minutes
      MYSQL_USER: minutes
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: minutes
      DB_USERNAME: minutes
      DB_PASSWORD: secret
      MINUTES_BASE_URL: http://host.docker.internal/api
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
